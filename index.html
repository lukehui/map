let current = "d17", map, markers = [], polylines = [], highlightPoly = null, selectedIdx = -1;

function initMap(){
  map = new google.maps.Map(document.getElementById("map"), {
    center: {lat: 22.32, lng: 114.17},
    zoom: 12,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: true
  });
  render();
}

function clearMap(){
  markers.forEach(m => m.setMap(null));
  markers = [];
  polylines.forEach(p => p.setMap(null));
  polylines = [];
  if (highlightPoly) { highlightPoly.setMap(null); highlightPoly = null; }
}

function draw(stops, selIdx){
  if (!map) return;
  clearMap();
  const bounds = new google.maps.LatLngBounds();
  const hasSel = selIdx >= 0;
  stops.forEach((s, i) => {
    const pos = {lat: s.lat, lng: s.lng};
    bounds.extend(pos);
    const isSel = hasSel && i === selIdx;
    const marker = new google.maps.Marker({
      position: pos,
      map: map,
      title: (i+1) + ". " + s.name,
      label: {text: String(i+1), color: "#fff", fontWeight: "bold"},
      opacity: isSel ? 1 : (hasSel ? 0.35 : 1),
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: isSel ? 14 : 12,
        fillColor: s.shuttle ? "#a16207" : "#9b2335",
        fillOpacity: isSel ? 1 : (hasSel ? 0.35 : 1),
        strokeColor: "#fff",
        strokeWeight: isSel ? 3 : 2
      }
    });
    marker.addListener("click", () => {
      if (selectedIdx === i) {
        selectedIdx = -1;
        draw(stops, -1);
        document.querySelectorAll("tr.loc").forEach(r => r.style.background = "");
        document.getElementById("pinName").style.display = "none";
      } else {
        selectStop(i, stops);
      }
    });
    markers.push(marker);
  });
  // 全日路線
  const path = stops.map(s => ({lat: s.lat, lng: s.lng}));
  polylines.push(new google.maps.Polyline({
    path, geodesic: true, strokeColor: "#9b2335",
    strokeOpacity: hasSel ? 0.25 : 0.7, strokeWeight: 4, map
  }));
  // 各段
  for (let i = 1; i < stops.length; i++) {
    const from = stops[i-1], to = stops[i];
    const isSel = hasSel && (i-1 === selIdx || i === selIdx);
    polylines.push(new google.maps.Polyline({
      path: [{lat: from.lat, lng: from.lng}, {lat: to.lat, lng: to.lng}],
      geodesic: true,
      strokeColor: to.shuttle ? "#a16207" : "#1e4d6b",
      strokeOpacity: isSel ? 0.95 : (hasSel ? 0.2 : 0.55),
      strokeWeight: isSel ? 6 : 3,
      map
    }));
  }
  if (!hasSel) map.fitBounds(bounds);
}

function selectStop(idx, stops){
  selectedIdx = idx;
  const s = stops[idx];
  draw(stops, idx);
  map.setCenter({lat: s.lat, lng: s.lng});
  map.setZoom(15);
  const el = document.getElementById("pinName");
  el.textContent = (idx+1) + ". " + s.name;
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 2500);
  document.querySelectorAll("tr.loc").forEach(tr => tr.style.background = "");
  const rows = document.querySelectorAll("tr.loc");
  if (rows[idx]) rows[idx].style.background = "#fde8e8";
}
function render(){
  document.getElementById("nav").innerHTML = DAYS.map(d => `<button class="${d.id===current?"on":""}" data-day="${d.id}">${d.nav}</button>`).join("");
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { current=b.dataset.day; render(); });
  const day = DAYS.find(d => d.id===current);
  document.getElementById("mapLabel").textContent = day.nav+" 全日路線";
  let html="";
  day.stops.forEach((s, idx) => {
    if (s.ride) html += `<tr class="ride${s.shuttle?" shuttle":""}" data-idx="${idx}"><td></td><td></td><td></td><td>${s.ride}</td></tr>`;
    const linkHtml = s.links ? s.links.map((l,i) => `<a href="${l}" target="_blank" rel="noopener">OpenRice${i===0?"（泰發）":"（泰金國）"}</a>`).join(" ") : `<a href="${s.link}" target="_blank" rel="noopener">${s.link.includes("openrice")?"OpenRice":"Google Map"}</a>`;
    html += `<tr class="loc" data-name="${s.name}" data-idx="${idx}"><td class="t">${idx+1}</td><td>${s.name}<br><span class="hint">${s.t}</span></td><td>${linkHtml}</td><td></td></tr>`;
  });
  document.getElementById("app").innerHTML = `<div class="alert">專車只係機場→逸東、逸東→探索家。其餘用港鐵、天星小輪、電車、穿梭巴士或機場快線。巧佳星期六多數休息，去之前先打電話。點擊地點可高亮，再點一次可取消。</div><h2>${day.title}</h2><p class="sub">${day.sub}</p><table class="main"><thead><tr><th>#</th><th>地點</th><th>連結</th><th>交通</th></tr></thead><tbody>${html}</tbody></table>`;
  document.querySelectorAll("tr.loc").forEach((tr, i) => tr.onclick = ev => {
    if (ev.target.tagName==="A") return;
    if (selectedIdx === i) {
      selectedIdx = -1;
      draw(day.stops, -1);
      document.querySelectorAll("tr.loc").forEach(r => r.style.background = "");
      document.getElementById("pinName").style.display = "none";
    } else {
      selectStop(i, day.stops);
    }
  });
  document.querySelectorAll("tr.ride").forEach(tr => tr.onclick = () => {
    const idx = parseInt(tr.dataset.idx,10);
    if (selectedIdx === idx) {
      selectedIdx = -1;
      draw(day.stops, -1);
      document.querySelectorAll("tr.loc").forEach(r => r.style.background = "");
      document.getElementById("pinName").style.display = "none";
    } else {
      selectStop(idx, day.stops);
    }
  });
  selectedIdx = -1;
  draw(day.stops, -1);
}

// 地圖高度拖曳調整
(function(){
  const handle = document.getElementById("resize-handle");
  let startY, startH, dragging = false;
  function setH(px){
    px = Math.max(120, Math.min(px, window.innerHeight * 0.75));
    document.documentElement.style.setProperty("--map-h", px + "px");
    if (map) setTimeout(() => google.maps.event.trigger(map, "resize"), 30);
  }
  handle.addEventListener("mousedown", e => {
    dragging = true; startY = e.clientY; startH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--map-h")) || 250;
    document.body.style.userSelect = "none";
  });
  document.addEventListener("mousemove", e => {
    if (!dragging) return;
    setH(startH + (e.clientY - startY));
  });
  document.addEventListener("mouseup", () => { dragging = false; document.body.style.userSelect = ""; });
  // touch
  handle.addEventListener("touchstart", e => {
    dragging = true; startY = e.touches[0].clientY; startH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--map-h")) || 250;
    e.preventDefault();
  }, {passive:false});
  document.addEventListener("touchmove", e => {
    if (!dragging) return;
    setH(startH + (e.touches[0].clientY - startY));
  }, {passive:true});
  document.addEventListener("touchend", () => { dragging = false; });
})();

// GPS 定位
document.getElementById("gpsBtn").onclick = () => {
  if (!navigator.geolocation) { alert("瀏覽器唔支援定位"); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    if (!map) return;
    if (window._me) window._me.setMap(null);
    window._me = new google.maps.Marker({
      position: {lat, lng},
      map,
      title: "我的位置",
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 10, fillColor: "#2563eb", fillOpacity: 1, strokeColor: "#fff", strokeWeight: 2 }
    });
    map.setCenter({lat, lng});
    map.setZoom(16);
    const el = document.getElementById("pinName");
    el.textContent = "我的位置";
    el.style.display = "block";
    setTimeout(() => el.style.display = "none", 2000);
  }, () => alert("定位失敗，請允許位置權限"));
};
