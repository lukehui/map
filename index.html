  main { padding:calc(var(--map-h) + var(--nav-h) + 12px) 14px 48px; max-width:980px; margin:0 auto; }

  .t { color:var(--red); font-weight:650; white-space:nowrap; }
  h2 { font-size:1.05rem; margin:4px 0; }
  .sub, .hint { color:var(--muted); }
  .hint { font-size:.8rem; }
  a { color:var(--blue); }
  @media (max-width:640px) { :root { --map-h:200px; } }
</style>

  if (map) return;
  map = L.map("map", {zoomControl:true});
  const a = L.tileLayer("https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png", {maxZoom:18, attribution:"Wikimedia"});
  const b = L.tileLayer("https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png", {subdomains:"abc", maxZoom:18, attribution:"OSM"});
  let n=0; a.addTo(map); a.on("tileerror", () => { if(++n>=2){ map.removeLayer(a); b.addTo(map);} });
  layer = L.layerGroup().addTo(map);
  highlight = L.layerGroup().addTo(map);
}
function draw(stops){
  ensureMap();
  layer.clearLayers();
  highlight.clearLayers();
  const pts = stops.map(s => [s.lat, s.lng]);
  // 全日路線
  L.polyline(pts, {color:"#9b2335", weight:4, opacity:.7}).addTo(layer);
  // 各段交通線（可點擊高亮）
  for(let i=1;i<stops.length;i++){
    const from = stops[i-1], to = stops[i];
    const seg = L.polyline([[from.lat,from.lng],[to.lat,to.lng]], {
      color: to.shuttle ? "#a16207" : "#1e4d6b",
      weight: 3,
      opacity: 0.55,
      dashArray: to.shuttle ? null : "6,4"
    }).addTo(layer);
    const mid = [(from.lat+to.lat)/2, (from.lng+to.lng)/2];
    const short = (to.ride||"").split("。")[0].slice(0,28);
    L.circleMarker(mid, {radius:4, color:"#fff", weight:1, fillColor: to.shuttle?"#a16207":"#1e4d6b", fillOpacity:0.9})
      .addTo(layer)
      .bindTooltip(short || "交通", {direction:"top"});
  }
  stops.forEach((s,i) => L.circleMarker([s.lat,s.lng], {radius:7, color:"#fff", weight:2, fillColor:s.shuttle?"#a16207":"#9b2335", fillOpacity:1}).addTo(layer).bindTooltip((i+1)+". "+s.name));
  map.fitBounds(pts, {padding:[28,28], maxZoom:13});
  setTimeout(() => map.invalidateSize(), 50);
}
function highlightSeg(from, to){
  ensureMap();
  highlight.clearLayers();
  if(!from || !to) return;
  L.polyline([[from.lat,from.lng],[to.lat,to.lng]], {color:"#d97706", weight:7, opacity:0.95}).addTo(highlight);
  map.fitBounds([[from.lat,from.lng],[to.lat,to.lng]], {padding:[40,40], maxZoom:15});
}
function render(){
  document.getElementById("nav").innerHTML = DAYS.map(d => `<button class="${d.id===current?"on":""}" data-day="${d.id}">${d.nav}</button>`).join("");
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { current=b.dataset.day; render(); });
  const day = DAYS.find(d => d.id===current);
  document.getElementById("mapLabel").textContent = day.nav+" 全日路線";
  let html="";
  day.stops.forEach((s, idx) => {
    if (s.ride) html += `<tr class="ride${s.shuttle?" shuttle":""}" data-idx="${idx}"><td></td><td></td><td></td><td>${s.ride}</td></tr>`;
    html += `<tr class="loc" data-name="${s.name}" data-idx="${idx}"><td class="t">${s.t}</td><td>${s.name}</td><td><a href="${s.link}" target="_blank" rel="noopener">${s.link.includes("openrice")?"OpenRice":"Google Map"}</a></td><td></td></tr>`;
  });
  document.getElementById("app").innerHTML = `<div class="alert">專車只係機場→逸東、逸東→探索家。其餘用港鐵、天星小輪、電車、穿梭巴士或機場快線。巧佳星期六多數休息，去之前先打電話。點擊交通行可在地圖高亮該段路線。</div><h2>${day.title}</h2><p class="sub">${day.sub}</p><table class="main"><thead><tr><th>時間</th><th>地點</th><th>連結</th><th>交通</th></tr></thead><tbody>${html}</tbody></table>`;
  document.querySelectorAll("tr.loc").forEach(tr => tr.onclick = ev => {
    if (ev.target.tagName==="A") return;
    const s = day.stops.find(x => x.name===tr.dataset.name);
    if (s) { ensureMap(); highlight.clearLayers(); map.setView([s.lat,s.lng], 15); }
  });
  document.querySelectorAll("tr.ride").forEach(tr => tr.onclick = () => {
    const idx = parseInt(tr.dataset.idx,10);
    const to = day.stops[idx];
    const from = day.stops[idx-1];
    if (from && to) highlightSeg(from, to);
  });
  draw(day.stops);
}
render();
</script>
</body>
</html>
